tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Get all contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      example: 10
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: ['asc', 'desc']
      example: asc
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: ['name', 'phoneNumber', 'email', 'isFavourite', 'contactType']
      example: contactType
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: false
  - name: contactType
    in: query
    required: false
    schema:
      type: string
      enum: ['home', 'work', 'personal']
      example: home
responses:
  '200':
    description: Get all contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPages
                - hasPreviousPages
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../conponents/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 5
                totalItems:
                  type: integer
                  example: 50
                hasNextPages:
                  type: boolean
                  example: true
                hasPreviousPages:
                  type: boolean
                  example: false
  '401':
    $ref: ../../conponents/responses/401.yaml
  '500':
    $ref: ../../conponents/responses/500.yaml
